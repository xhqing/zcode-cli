<svg xmlns="http://www.w3.org/2000/svg" width="640" height="200" viewBox="0 0 640 200" role="img" aria-label="ZCode CLI">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0E1F"/>
      <stop offset="55%" stop-color="#111538"/>
      <stop offset="100%" stop-color="#1B1033"/>
    </linearGradient>
    <linearGradient id="zgrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#67E8F9"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="frame">
      <rect width="640" height="200" rx="28" ry="28"/>
    </clipPath>
  </defs>

  <rect width="640" height="200" rx="28" ry="28" fill="url(#bg)"/>

  <!-- Faint cyber grid, clipped to the rounded frame -->
  <g clip-path="url(#frame)" stroke="#38BDF8" stroke-opacity="0.07" stroke-width="1">
    <line x1="80" y1="0" x2="80" y2="200"/>
    <line x1="160" y1="0" x2="160" y2="200"/>
    <line x1="240" y1="0" x2="240" y2="200"/>
    <line x1="320" y1="0" x2="320" y2="200"/>
    <line x1="400" y1="0" x2="400" y2="200"/>
    <line x1="480" y1="0" x2="480" y2="200"/>
    <line x1="560" y1="0" x2="560" y2="200"/>
    <line x1="0" y1="40" x2="640" y2="40"/>
    <line x1="0" y1="80" x2="640" y2="80"/>
    <line x1="0" y1="120" x2="640" y2="120"/>
    <line x1="0" y1="160" x2="640" y2="160"/>
  </g>

  <!-- Magenta chromatic-ghost of the Z (glitch offset) -->
  <path d="M56 40 L152 40 L152 54 L94 138 L152 138 L152 152 L56 152 L56 138 L114 54 L56 54 Z"
        fill="#E879F9" fill-opacity="0.45" transform="translate(5 -4)"/>

  <!-- Neon Z: chamfered corners + notched top bar for the cyberpunk cut -->
  <path d="M52 44 L138 44 L148 54 L148 58 L90 142 L148 142 L148 156 L62 156 L52 146 L52 142 L110 58 L52 58 Z"
        fill="url(#zgrad)" filter="url(#glow)"/>

  <!-- Glitch slices through the Z -->
  <g clip-path="url(#frame)">
    <rect x="36" y="92" width="34" height="3" fill="#67E8F9" fill-opacity="0.9"/>
    <rect x="120" y="104" width="42" height="3" fill="#E879F9" fill-opacity="0.8"/>
  </g>

  <text x="196" y="95" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="36" font-weight="700" dominant-baseline="central">
    <tspan fill="#67E8F9">ZCode</tspan><tspan fill="#FFFFFF"> CLI</tspan><tspan fill="#22D3EE">_</tspan>
  </text>
  <text x="198" y="128" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="17" fill="#94A3B8" dominant-baseline="central">Unofficial Terminal Client for ZCode Desktop</text>
</svg>
